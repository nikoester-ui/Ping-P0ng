<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d1c"><title>Neon Ping Arena — Aftershock 1.20</title><link rel="icon" href="assets/icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><canvas id="game" width="1200" height="680" aria-label="Neon Ping Arena game. E and D move your paddle; O and K control player two." tabindex="0"></canvas>
<header id="hud" hidden><div class="hud-left"><button id="pause" class="icon-button" aria-label="Pause">Ⅱ</button><div><b id="mode-label">CLASSIC</b><small id="mode-detail">NORMAL</small></div></div><div id="score-hud" class="score-hud">0 <em>:</em> 0</div><div class="hud-right"><span class="coin-badge">● <b id="coin-value">0</b></span><span class="xp-badge"><span class="xp-icon">XP</span><b id="xp-value">0</b></span></div></header>
<div id="boss-hud" hidden><div><b>THE OVERLORD</b><span id="boss-count">15 / 15</span></div><div class="health-track"><i id="boss-fill"></i></div></div>
<div id="banner" aria-live="polite"></div><div id="round-caption"></div>
<div id="overlay"><main id="panel" class="panel"></main></div>
<div id="toast" role="status"></div><button id="sound" class="corner-button" aria-label="Toggle sound">SOUND ON</button>
</div>
<script src="config.js"></script><script src="shared/policy.js"></script><script src="shared/core.js"></script><script src="game.js"></script>
</body></html>
