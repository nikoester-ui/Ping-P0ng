<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Ping Arena</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}
body{display:grid;place-items:center;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#wrap{position:relative;width:min(98vw,1280px);aspect-ratio:16/9;max-height:98vh;overflow:hidden;border:2px solid rgba(255,255,255,.15);border-radius:24px;background:#05060a}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none}
#topHud{position:absolute;top:12px;left:14px;right:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;z-index:8}
.hudSide{display:flex;gap:8px;align-items:center}.hudSide.right{justify-content:flex-end}
.hudPill{background:rgba(2,5,11,.72);border:1px solid rgba(255,255,255,.18);padding:8px 11px;border-radius:999px;backdrop-filter:blur(9px);font-size:12px;font-weight:900;letter-spacing:.09em}
.scoreLabel{text-align:center;font-weight:950;font-size:clamp(22px,3vw,38px);line-height:1;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.2)}
.scoreLabel small{display:block;font-size:10px;letter-spacing:.14em;margin-top:6px;color:rgba(255,255,255,.52)}
.coinPill{display:flex;align-items:center;gap:7px}.coinPill img{width:21px;height:21px}
.coinNum{font-size:16px;color:#ffdf57;-webkit-text-stroke:1px #2d1800;text-shadow:1px 1px #2d1800,-1px 1px #2d1800,1px -1px #2d1800,-1px -1px #2d1800}
#pauseBtn{pointer-events:auto;display:none;position:absolute;right:14px;top:58px;z-index:10;width:48px;height:42px;padding:0;border-radius:13px;background:rgba(4,7,14,.8);border:1px solid rgba(255,255,255,.2);box-shadow:none}
#pauseBtn.show{display:flex;align-items:center;justify-content:center}
.pauseBars{display:flex;gap:7px}.pauseBars i{display:block;width:6px;height:20px;background:#fff;border-radius:2px;box-shadow:0 0 7px rgba(255,255,255,.5)}
#center{position:absolute;inset:0;display:grid;place-items:center;z-index:7}
.panel{pointer-events:auto;width:min(830px,92%);max-height:92%;overflow:auto;padding:25px;border:1px solid rgba(255,255,255,.15);border-radius:26px;background:linear-gradient(180deg,rgba(8,12,24,.95),rgba(3,5,10,.92));backdrop-filter:blur(18px);box-shadow:0 30px 90px rgba(0,0,0,.55)}
h1{margin:0;font-size:clamp(40px,7vw,74px);line-height:.9;letter-spacing:-.055em;font-weight:950;text-shadow:0 0 20px rgba(71,225,255,.25)}h1 span{color:#63ffe8}
.sub{max-width:650px;margin:14px auto 18px;color:rgba(255,255,255,.65);font-size:14px;line-height:1.5}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{appearance:none;border:0;border-radius:15px;padding:13px 18px;background:#63ffe8;color:#02120e;font-weight:950;cursor:pointer;transition:.16s ease;box-shadow:0 0 20px rgba(99,255,232,.2)}
button.secondary{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.15);box-shadow:none}
button:hover,button:focus-visible,.card:hover,.card:focus-visible{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 24px var(--glow,rgba(99,255,232,.3))}
button:active,.card:active{transform:scale(.98)}
.cardGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}
.card{--glow:rgba(99,255,232,.3);position:relative;text-align:left;padding:14px;border-radius:18px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);cursor:pointer;transition:.16s ease}
.card.selected{outline:2px solid var(--accent,#63ffe8);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 25%,transparent)}
.cardTitle{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:950}.diffIcon{width:45px;height:45px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(255,255,255,.18))}
.easy{--accent:#65ff87;--glow:rgba(101,255,135,.35);border-color:rgba(101,255,135,.35)}.normal{--accent:#68a8ff;--glow:rgba(104,168,255,.35);border-color:rgba(104,168,255,.35)}.hard{--accent:#ff6666;--glow:rgba(255,102,102,.35);border-color:rgba(255,102,102,.35)}.impossible{--accent:#c971ff;--glow:rgba(201,113,255,.35);border-color:rgba(201,113,255,.35)}
.reward{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:900;color:#ffdf57}.reward img{width:17px;height:17px}
.modePick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.modePick .card{text-align:center}.bossCard{--accent:#ff7d42;--glow:rgba(255,80,20,.45);border-color:rgba(255,91,43,.38);background:linear-gradient(135deg,rgba(110,22,4,.25),rgba(20,5,4,.25))}
.coinBig{display:flex;align-items:center;justify-content:center;gap:8px;color:#ffdf57;font-size:22px;font-weight:950;-webkit-text-stroke:1px #2d1800}.coinBig img{width:27px;height:27px}
.shopHead{display:flex;align-items:center;justify-content:center;gap:12px}.shopHead img{width:38px;height:38px}
.tabs{display:flex;justify-content:center;gap:8px;margin:12px 0}
.preview{height:110px;border-radius:15px;overflow:hidden;border:1px solid rgba(255,255,255,.13);position:relative;background:#080b12}
.preview img.bg{width:100%;height:100%;object-fit:cover}
.preview .arena{position:absolute;inset:10px;border:3px solid var(--accent);border-radius:12px;box-shadow:0 0 12px var(--accent)}
.preview .mid{position:absolute;left:50%;top:14px;bottom:14px;border-left:2px dashed rgba(255,255,255,.35)}
.ballPreview{height:110px;display:grid;place-items:center;border-radius:15px;background:radial-gradient(circle at center,rgba(50,90,140,.16),#070912 70%);border:1px solid rgba(255,255,255,.13)}
.ballPreview img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(255,255,255,.18))}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:950;font-size:clamp(44px,8vw,100px);opacity:0;letter-spacing:-.04em;text-shadow:0 0 26px currentColor}
#bossHud{display:none;position:absolute;left:50%;top:58px;transform:translateX(-50%);width:min(520px,58vw);z-index:8}
#bossHud.show{display:block}.bossText{display:flex;justify-content:space-between;font-size:11px;font-weight:950;letter-spacing:.1em;color:#ff8585;margin-bottom:5px}.healthOuter{height:15px;padding:2px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45)}.healthInner{height:100%;border-radius:999px;background:linear-gradient(90deg,#ff2d2d,#ff6b45);box-shadow:0 0 12px rgba(255,45,45,.45);transition:width .18s ease}
#rotateNote{display:none;position:absolute;inset:0;z-index:60;background:#05060a;place-items:center;text-align:center;padding:30px}
@media(max-width:760px){#wrap{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;border:0;border-radius:0}.panel{width:94%;padding:18px 13px}.cardGrid{grid-template-columns:1fr 1fr}.modePick{grid-template-columns:1fr 1fr}.hudPill{padding:6px 8px;font-size:10px}.scoreLabel{font-size:24px}#pauseBtn{right:8px;top:52px}.preview,.ballPreview{height:90px}}
@media(orientation:portrait) and (max-width:900px){#rotateNote{display:grid}}

.leaderList{display:grid;gap:8px;margin:16px 0;text-align:left}
.leaderRow{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;padding:11px 12px;border:1px solid rgba(255,255,255,.11);border-radius:14px;background:rgba(255,255,255,.035)}
.leaderRank{font-size:20px;font-weight:950;color:#ffdf57;text-align:center}.leaderName{font-weight:950}.leaderMeta{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px}
.leaderScore{font-weight:950;color:#63ffe8}.leaderReward{font-weight:900;color:#ffdf57}
.ballFx{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}
.ballFx img{position:relative;z-index:3;width:72px;height:72px;object-fit:contain;animation:ballFloat 2.2s ease-in-out infinite}
.ballFx::before,.ballFx::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.fx-classic img{animation:ballFloat 2.2s ease-in-out infinite,ballSpin 7s linear infinite}
.fx-fire::before{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle,#ffd467 0 18%,#ff6a00 42%,rgba(255,50,0,0) 72%);filter:blur(7px);animation:firePulse .55s ease-in-out infinite alternate}
.fx-fire::after{width:46px;height:98px;border-radius:50%;background:linear-gradient(to top,rgba(255,50,0,0),rgba(255,90,0,.72),rgba(255,235,90,0));filter:blur(7px);animation:flameDance .38s ease-in-out infinite alternate}
.fx-ice::before{width:88px;height:88px;border:2px solid rgba(160,235,255,.7);border-radius:50%;box-shadow:0 0 18px rgba(120,220,255,.75),inset 0 0 16px rgba(120,220,255,.32);animation:ringSpin 2.7s linear infinite}
.fx-ice::after{width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:31px 8px #bdf3ff,-29px -12px #dfffff,14px -34px #9feaff,-20px 31px #fff;animation:sparkOrbit 2s linear infinite}
.fx-eight::before{width:88px;height:88px;border-radius:50%;border:1px dashed rgba(255,255,255,.48);animation:ringSpin 3.5s linear infinite}
.fx-eight::after{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 13px #fff;animation:orbitDot 2.2s linear infinite}
.fx-plasma::before{width:92px;height:92px;border-radius:50%;background:conic-gradient(from 0deg,transparent,#d75cff,transparent,#59d7ff,transparent);filter:blur(3px);animation:ringSpin .85s linear infinite}
.fx-plasma::after{width:76px;height:76px;border-radius:50%;border:2px solid rgba(230,120,255,.6);box-shadow:0 0 20px #c54cff,0 0 36px rgba(80,210,255,.55);animation:plasmaPulse .7s ease-in-out infinite alternate}
@keyframes ballFloat{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}@keyframes ballSpin{to{rotate:360deg}}
@keyframes firePulse{from{scale:.86;opacity:.65}to{scale:1.17;opacity:1}}@keyframes flameDance{from{transform:translate(-50%,-50%) skewX(-8deg) scaleY(.9)}to{transform:translate(-50%,-56%) skewX(9deg) scaleY(1.24)}}
@keyframes ringSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes sparkOrbit{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes orbitDot{0%{transform:translate(-50%,-50%) translateX(43px)}100%{transform:translate(-50%,-50%) rotate(360deg) translateX(43px)}}@keyframes plasmaPulse{from{scale:.86;opacity:.65}to{scale:1.12;opacity:1}}


:root{--ui-cyan:#74f3ff;--ui-violet:#a56cff;--ui-gold:#ffd65a;--ui-red:#ff4a55}
body:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -10%,rgba(70,200,255,.09),transparent 38%),linear-gradient(180deg,rgba(255,255,255,.015),transparent 24%)}
.panel{border-color:rgba(150,220,255,.17);background:linear-gradient(180deg,rgba(7,13,28,.97),rgba(2,5,12,.96));box-shadow:0 24px 80px rgba(0,0,0,.62),inset 0 1px rgba(255,255,255,.025)}
.brandKicker{display:flex;justify-content:center;gap:9px;align-items:center;margin-bottom:9px;font-size:11px;font-weight:950;letter-spacing:.24em;color:rgba(220,245,255,.62)}
.brandKicker span{letter-spacing:.08em;color:var(--ui-cyan);border:1px solid rgba(116,243,255,.28);padding:3px 7px;border-radius:999px;background:rgba(116,243,255,.06)}
button{min-height:45px;border:1px solid rgba(150,245,255,.28);background:linear-gradient(180deg,#86fff1,#48e8e4);letter-spacing:.04em;text-transform:uppercase;box-shadow:0 0 0 1px rgba(255,255,255,.035) inset,0 8px 24px rgba(55,230,230,.12)}
button.secondary{background:linear-gradient(180deg,rgba(23,34,56,.92),rgba(9,16,30,.96));border:1px solid rgba(162,213,255,.18)}
@media (hover:hover) and (pointer:fine){button:hover,.card:hover{transform:translateY(-2px);border-color:rgba(175,245,255,.48);box-shadow:0 0 0 1px rgba(120,240,255,.12) inset,0 0 26px var(--glow,rgba(90,235,255,.18))}}
.card{background:linear-gradient(180deg,rgba(17,27,48,.76),rgba(6,12,25,.88));border-color:rgba(155,210,255,.13)}
.card.selected{background:linear-gradient(180deg,rgba(23,41,67,.82),rgba(6,13,27,.94))}
.modePick .card{min-height:94px}
#topHud .hudPill{border-color:rgba(150,210,255,.16);background:linear-gradient(180deg,rgba(9,18,34,.88),rgba(4,9,18,.88))}
.scoreLabel{padding:7px 18px 8px;border-radius:16px;background:linear-gradient(180deg,rgba(10,20,38,.68),rgba(2,6,14,.76));border:1px solid rgba(150,220,255,.12)}
#pauseBtn{border-color:rgba(160,220,255,.22);background:linear-gradient(180deg,rgba(17,30,49,.92),rgba(6,12,23,.95))}
.resultScreen{position:relative;overflow:hidden;text-align:center;padding:8px 4px}
.resultEmblem{width:94px;height:94px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,224,98,.72);background:radial-gradient(circle at 40% 35%,#fff0a3,#f4b91c 44%,#7a4100 78%);box-shadow:0 0 34px rgba(255,205,50,.28),inset 0 0 20px rgba(255,255,255,.24);font-size:42px;animation:rewardPop .62s cubic-bezier(.2,1.5,.25,1)}
.resultTitle{font-size:clamp(44px,7vw,76px);font-weight:1000;letter-spacing:-.045em;line-height:.95}
.resultTitle.win{color:#dffff8;text-shadow:0 0 28px rgba(90,255,210,.28)}
.resultTitle.lose{color:#ffd8dc;text-shadow:0 0 28px rgba(255,70,80,.24)}
.rewardReveal{margin:18px auto;width:min(430px,90%);padding:15px 18px;border-radius:18px;border:1px solid rgba(255,217,78,.28);background:linear-gradient(180deg,rgba(70,48,5,.3),rgba(20,13,2,.36));animation:rewardSlide .7s .18s both cubic-bezier(.2,.9,.2,1)}
.rewardAmount{display:flex;justify-content:center;align-items:center;gap:10px;font-size:28px;font-weight:1000;color:#ffe173}
.rewardAmount img{width:34px;height:34px;animation:coinSpin 1.4s ease-in-out infinite}
.resultStats{font-size:13px;color:rgba(220,240,255,.64);letter-spacing:.08em}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12%;width:7px;height:14px;border-radius:2px;animation:confettiFall var(--dur) var(--delay) linear infinite}
.globalStatus{display:inline-flex;align-items:center;gap:7px;margin:8px auto 0;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.08em;border:1px solid rgba(255,255,255,.12);color:rgba(230,245,255,.68)}
.globalStatus.online{color:#78ff9c;border-color:rgba(120,255,155,.24);background:rgba(30,150,70,.08)}
.globalStatus.offline{color:#ffcb75;border-color:rgba(255,190,90,.22);background:rgba(160,90,10,.08)}
.leaderTop{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;text-align:left;margin:10px 0 12px}
.leaderTop b{font-size:14px}.leaderTop small{display:block;color:rgba(220,240,255,.5);margin-top:2px}
.leaderRow{grid-template-columns:48px minmax(0,1fr) auto;border-color:rgba(150,215,255,.10);background:linear-gradient(180deg,rgba(12,22,40,.72),rgba(5,11,22,.78))}
.leaderRow.top1{border-color:rgba(255,214,90,.3);background:linear-gradient(180deg,rgba(75,54,8,.28),rgba(19,14,4,.25))}
.leaderRow.top2{border-color:rgba(205,230,255,.25)}.leaderRow.top3{border-color:rgba(224,151,93,.25)}
.leaderScoreBlock{text-align:right}.leaderScoreBlock b{color:#8ffff3}.leaderScoreBlock small{display:block;color:rgba(220,240,255,.46);font-size:10px;margin-top:2px}
.loadingRing{width:26px;height:26px;border-radius:50%;margin:28px auto;border:3px solid rgba(255,255,255,.1);border-top-color:#72efff;animation:spin .75s linear infinite}
.toast{position:absolute;left:50%;bottom:24px;z-index:30;transform:translate(-50%,18px);opacity:0;padding:10px 14px;border-radius:12px;background:rgba(5,12,23,.94);border:1px solid rgba(145,220,255,.2);font-size:12px;font-weight:850;color:#e7f9ff;pointer-events:none;transition:.22s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes rewardPop{0%{transform:scale(.3) rotate(-14deg);opacity:0}70%{transform:scale(1.12) rotate(4deg)}100%{transform:scale(1);opacity:1}}
@keyframes rewardSlide{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes coinSpin{50%{transform:rotateY(180deg) scale(1.08)}}
@keyframes confettiFall{to{transform:translateY(720px) rotate(620deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud">
 <div id="topHud">
   <div class="hudSide"><div class="hudPill" id="modePill">NORMAL</div></div>
   <div class="scoreLabel"><span id="scoreText">0 - 0</span><small id="scoreSub">FIRST TO 5</small></div>
   <div class="hudSide right"><div class="hudPill coinPill"><img src="coin.png"><span class="coinNum" id="coinHud">0</span></div></div>
 </div>
 <button id="pauseBtn"><span class="pauseBars"><i></i><i></i></span></button>
 <div id="bossHud"><div class="bossText"><span>BOSS HEALTH</span><span id="bossHits">0 / 25 HITS</span></div><div class="healthOuter"><div class="healthInner" id="bossHealth"></div></div></div>
 <div id="message">GO!</div>
</div>
<div id="center"><div id="panel" class="panel"></div></div>
<div id="rotateNote"><div><div style="font-size:48px">↻</div><h2>Rotate your phone</h2><div class="sub">Landscape mode is required for the arena.</div></div></div>
</div><div id="toast" class="toast"></div>
<script src="leaderboard-config.js"></script>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('wrap'),center=document.getElementById('center'),panel=document.getElementById('panel');
const scoreText=document.getElementById('scoreText'),scoreSub=document.getElementById('scoreSub'),coinHud=document.getElementById('coinHud'),modePill=document.getElementById('modePill'),pauseBtn=document.getElementById('pauseBtn'),message=document.getElementById('message'),bossHud=document.getElementById('bossHud'),bossHealth=document.getElementById('bossHealth'),bossHits=document.getElementById('bossHits'),toast=document.getElementById('toast');
let W=1280,H=720,DPR=1,last=performance.now(),particles=[],rings=[],trail=[];

const DIFF={
 easy:{name:'EASY',reward:15,cpu:315,error:105,predict:.48,ramp:27,accent:'#65ff87',icon:'skull-easy.png',desc:'A relaxed match for new players.'},
 normal:{name:'NORMAL',reward:30,cpu:430,error:63,predict:.69,ramp:38,accent:'#68a8ff',icon:'skull-normal.png',desc:'Balanced speed and prediction.'},
 hard:{name:'HARD',reward:50,cpu:570,error:30,predict:.88,ramp:48,accent:'#ff6666',icon:'skull-hard.png',desc:'Fast reactions and sharp angles.'},
 impossible:{name:'IMPOSSIBLE',reward:80,cpu:790,error:8,predict:1,ramp:58,accent:'#c971ff',icon:'skull-impossible.png',desc:'Near-perfect reactions. Survive if you can.'}
};
const THEMES={
 space:{name:'Nebula Arena',price:0,img:'theme-space.png',arena:'#68ddff'},
 jungle:{name:'Emerald Jungle',price:100,img:'theme-jungle.png',arena:'#65ff87'},
 lava:{name:'Volcanic Core',price:160,img:'theme-lava.png',arena:'#ff642f'},
 ice:{name:'Frozen Citadel',price:220,img:'theme-ice.png',arena:'#9eeaff'},
 cyber:{name:'Cyber City',price:300,img:'theme-cyber.png',arena:'#ff5cf3'}
};
const BALLS={
 classic:{name:'Tennis Core',price:0,img:'ball-classic.png'},
 fire:{name:'Fireball',price:110,img:'ball-fire.png'},
 ice:{name:'Ice Crystal',price:160,img:'ball-ice.png'},
 eight:{name:'8-Ball',price:220,img:'ball-eight.png'},
 plasma:{name:'Plasma Orb',price:300,img:'ball-plasma.png'}
};
const imgs={};
[...Object.values(THEMES).map(x=>x.img),...Object.values(BALLS).map(x=>x.img),'boss-skull.png','boss-skull-0.png','boss-skull-1.png','boss-skull-2.png','boss-skull-3.png','boss-skull-4.png'].forEach(src=>{const i=new Image();i.src=src;imgs[src]=i});

const defaults={coins:0,difficulty:'normal',gameMode:'classic',theme:'space',ball:'classic',ownedThemes:['space'],ownedBalls:['classic'],playerName:'PLAYER',leaderboard:[]};
let raw={};try{raw=JSON.parse(localStorage.getItem('neonPingSave')||'{}')||{}}catch(e){}
let save={...defaults,...raw};
// migration from older builds
if(raw.theme==='neon')save.theme='space';
if(raw.gear && !raw.ball)save.ball=raw.gear==='classic'?'classic':raw.gear;
if(!Array.isArray(save.ownedThemes))save.ownedThemes=['space'];
save.ownedThemes=save.ownedThemes.map(x=>x==='neon'?'space':x).filter(x=>THEMES[x]);
if(!save.ownedThemes.includes('space'))save.ownedThemes.unshift('space');
if(!Array.isArray(save.ownedBalls)){
  save.ownedBalls=Array.isArray(raw.ownedGear)?raw.ownedGear.filter(x=>BALLS[x]):['classic'];
}
if(!save.ownedBalls.includes('classic'))save.ownedBalls.unshift('classic');
if(!THEMES[save.theme])save.theme='space';
if(!BALLS[save.ball])save.ball='classic';
if(!DIFF[save.difficulty])save.difficulty='normal';

function globalHeaders(extra={}){return {'apikey':LB_CFG.publishableKey||'','Authorization':`Bearer ${LB_CFG.publishableKey||''}`,'Content-Type':'application/json',...extra}}
function addLocalLeaderboard(mode,detail,reward,rankScore){
 save.leaderboard.push({name:save.playerName,mode,detail,reward,rankScore,time:Date.now()});
 save.leaderboard=save.leaderboard.sort((a,b)=>(b.rankScore||0)-(a.rankScore||0)||(b.time||0)-(a.time||0)).slice(0,30);persist();

async function submitGlobalScore(mode,detail,reward,rankScore){
 addLocalLeaderboard(mode,detail,reward,rankScore);
 if(!GLOBAL_ON)return false;
 try{
   const body={player_name:save.playerName.slice(0,16),mode:String(mode).slice(0,24),detail:String(detail).slice(0,32),reward:Math.max(0,Math.round(reward)),score:Math.max(0,Math.round(rankScore)),client_version:'1.07'};
   const r=await fetch(`${LB_CFG.url}/rest/v1/neon_ping_scores`,{method:'POST',headers:globalHeaders({'Prefer':'return=minimal'}),body:JSON.stringify(body)});
   if(!r.ok)throw new Error(`HTTP ${r.status}`);
   uiToast('GLOBAL SCORE SUBMITTED');return true;
 }catch(e){console.warn('Global score submit failed',e);uiToast('SAVED LOCALLY — ONLINE SYNC FAILED');return false}

async function fetchGlobalScores(){

function paddleCollision(p,isPlayer){
 const x1=p.x-p.w/2,x2=p.x+p.w/2,y1=p.y-p.h/2,y2=p.y+p.h/2;
 if(ball.x+ball.r>x1&&ball.x-ball.r<x2&&ball.y+ball.r>y1&&ball.y-ball.r<y2&&((isPlayer&&ball.vx<0)||(!isPlayer&&ball.vx>0))){
  let rel=clamp((ball.y-p.y)/(p.h/2),-1,1),dir=isPlayer?1:-1,ang=rel*.92;
  state.rally++;let ramp=save.gameMode==='boss'?42:DIFF[save.difficulty].ramp;ball.speed=Math.min(save.gameMode==='boss'?1250:1450,590+state.rally*ramp);
  ball.vx=Math.cos(ang)*ball.speed*dir;ball.vy=Math.sin(ang)*ball.speed+p.vy*.18;ball.x=isPlayer?x2+ball.r+2:x1-ball.r-2;
  burst(ball.x,ball.y,THEMES[save.theme].arena,18,280);ring(ball.x,ball.y,THEMES[save.theme].arena);state.shake=8;sHit();
 }
}

function updateBossHud(){let done=state.bossMax-state.bossHP;bossHits.textContent=`${done} / ${state.bossMax} HITS`;bossHealth.style.width=`${Math.max(0,state.bossHP/state.bossMax*100)}%`}
function bossHit(){
 state.bossHP--;updateBossHud();state.shake=15;burst(state.bossX,state.bossY,'#ff5b37',38,430);
 let damageHits=state.bossMax-state.bossHP;
 if(damageHits%5===0 && state.bossHP>0){burst(state.bossX,state.bossY,'#ffffff',55,520);showMessage(`DAMAGE ${damageHits}/${state.bossMax}!`,'#ff7654');state.shake=22;sBossDamage()}
 else showMessage(`${damageHits}/${state.bossMax}`,'#ff7654');
 sHit();
 if(state.bossHP<=0){bossWin();return}
 // The boss always catches the incoming ball. Returns become faster and nastier over time.
 let hits=state.bossMax-state.bossHP;
 ball.speed=Math.min(1550,650+hits*27+state.bossElapsed*5.5);
 let danger=clamp(state.bossElapsed/55 + hits/state.bossMax*.55,0,1);
 let targetOffset=(Math.random()<.5?-1:1)*(player.h*.28 + player.h*.34*danger);
 let targetY=clamp(player.y+targetOffset,30,H-30);
 let dx=Math.max(120,state.bossX-player.x),dy=targetY-state.bossY;
 let ang=clamp(Math.atan2(dy,dx),-.78,.78);
 ball.vx=-Math.abs(Math.cos(ang)*ball.speed);
 ball.vy=Math.sin(ang)*ball.speed;
 let bw=Math.min(H*.34,210),bossPlane=state.bossX-bw*.48;
 ball.x=bossPlane-ball.r-3;
 ball.y=clamp(ball.y,ball.r+15,H-ball.r-15);
}
function bossWin(){
 state.bossExploding=true;ball.vx=ball.vy=0;state.playing=false;showPause(false);
 burst(state.bossX,state.bossY,'#ff431f',150,760);burst(state.bossX,state.bossY,'#ffffff',90,620);state.shake=30;save.coins+=50;submitGlobalScore('BOSS MODE',`${state.bossMax} hits`,50,600+Math.max(0,120-Math.round(state.bossElapsed*2)));persist();bossHud.classList.remove('show');showMessage('BOSS DOWN!','#ffb05f');
 sVictory();setTimeout(sReward,260);setTimeout(()=>{center.style.display='grid';panel.innerHTML=`<div class="resultScreen">${confettiHtml()}<div class="resultEmblem">☠</div><div class="resultTitle win">BOSS DESTROYED</div><div class="sub">25 direct hits. The arena is yours.</div><div class="rewardReveal"><div class="rewardAmount"><img src="coin.png">+50 COINS</div><div class="sub" style="margin:6px 0 0">${save.coins} total balance</div></div><div class="row"><button id="again">FIGHT AGAIN</button><button class="secondary" id="back">ARENA MENU</button></div></div>`;document.getElementById('again').onclick=startGame;document.getElementById('back').onclick=mainMenu},850)
}

function update(dt){
 if(state.paused)return;state.time+=dt;state.shake*=Math.pow(.001,dt);if(!state.playing)return;
 player.h=clamp(H*.2,92,136);player.x=34;let py=player.y;
 let dir=0;if(keys.has('w')||keys.has('arrowup'))dir--;if(keys.has('s')||keys.has('arrowdown'))dir++;
 if(dir){player.y+=dir*700*dt;player.targetY=player.y}else player.y+=(player.targetY-player.y)*Math.min(1,dt*17);
 player.y=clamp(player.y,player.h/2+16,H-player.h/2-16);player.vy=(player.y-py)/Math.max(.001,dt);

 if(save.gameMode==='classic'){
  cpu.h=player.h;cpu.x=W-34;const d=DIFF[save.difficulty];let target=H/2;
  if(ball.vx>0){let t=(cpu.x-ball.x)/ball.vx,pred=ball.y+ball.vy*t*d.predict+(1-d.predict)*ball.y,min=ball.r+18,max=H-ball.r-18,span=max-min,q=(pred-min)%(span*2);if(q<0)q+=span*2;target=min+(q>span?span*2-q:q)}else target=H/2+Math.sin(state.time*1.4)*H*.1;
